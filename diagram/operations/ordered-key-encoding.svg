<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 790" role="img" aria-labelledby="title desc">
<title id="title">Ordered key bytes preserve logical key order</title>
<desc id="desc">Within a table generation, encode the partition key followed by its sort key when present. Each component has a schema type tag, an order-preserving escaped payload and a two-byte terminator. Strings use UTF-8 byte order, binary uses unsigned byte order, and numbers use exact normalized decimal order. Embedded zero escapes as 00 ff and a complete component ends with 00 00. Table generation and tenant scope are outside user-key comparison. A GSI appends the complete ordered base key to break ties.</desc>
<defs>
 <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#1e293b" stroke-width="0.6"/></pattern>
 <style>
 text{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#f1f5f9}
 .title{font-size:32px;font-weight:700;letter-spacing:-0.6px}
 .heading{font-size:22px;font-weight:650}
 .body{font-size:20px}
 .note{font-size:18px;fill:#b8c7db}
 .eyebrow{font-size:17px;font-weight:650;letter-spacing:1.4px}
 .edge{fill:none;stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
 </style>
<marker id="arrow-cyan" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#22d3ee" stroke-width="1.6"/></marker>
<marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#34d399" stroke-width="1.6"/></marker>
<marker id="arrow-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#a78bfa" stroke-width="1.6"/></marker>
<marker id="arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#fbbf24" stroke-width="1.6"/></marker>
<marker id="arrow-rose" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#fb7185" stroke-width="1.6"/></marker>
<marker id="arrow-slate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#94a3b8" stroke-width="1.6"/></marker>
</defs>
<rect width="1120" height="790" fill="#0f172a"/>
<rect width="1120" height="790" fill="url(#grid)"/>
<text x="40" y="53" class="title">Ordered key bytes preserve logical key order</text>
<text x="40" y="88" class="note">One encoding feeds directory routing, Cell ownership checks and local ordered storage.</text>
<rect x="40" y="140" width="1040" height="76" rx="12" fill="#102e40" stroke="#22d3ee" stroke-width="1.6"/>
<text x="560" y="171" class="heading" text-anchor="middle">Logical primary key: PK + optional SK</text>
<text x="560" y="198" class="note" text-anchor="middle">Schema types determine byte, string or exact decimal comparison.</text>
<path d="M560 216V256" class="edge" stroke="#22d3ee"/>
<path d="M285 256H835" class="edge" stroke="#22d3ee"/>
<path d="M285 256V296" class="edge" stroke="#34d399" marker-end="url(#arrow-green)"/>
<path d="M835 256V296" class="edge" stroke="#34d399" marker-end="url(#arrow-green)"/>
<rect x="40" y="296" width="490" height="104" rx="12" fill="#10392f" stroke="#34d399" stroke-width="1.6"/>
<text x="60" y="330" class="heading">Partition-key component</text>
<text x="60" y="362" class="note">type tag  |  escaped ordered payload  |  00 00</text>
<text x="60" y="388" class="note">Embedded 00 → 00 ff; full component ends with 00 00.</text>
<rect x="590" y="296" width="490" height="104" rx="12" fill="#10392f" stroke="#34d399" stroke-width="1.6"/>
<text x="610" y="330" class="heading">Sort-key component, when present</text>
<text x="610" y="362" class="note">type tag  |  escaped ordered payload  |  00 00</text>
<text x="610" y="388" class="note">Embedded 00 → 00 ff; full component ends with 00 00.</text>
<path d="M285 400V448H835V400" class="edge" stroke="#a78bfa"/>
<path d="M560 448V488" class="edge" stroke="#a78bfa" marker-end="url(#arrow-purple)"/>
<rect x="40" y="488" width="1040" height="88" rx="12" fill="#292047" stroke="#a78bfa" stroke-width="1.6"/>
<text x="560" y="523" class="heading" text-anchor="middle">Base key = encoded PK || encoded SK</text>
<text x="560" y="552" class="note" text-anchor="middle">PK-only tables use encoded PK. Tenant and table generation scope the directory.</text>
<text x="40" y="630" class="heading">String and binary order</text>
<text x="40" y="662" class="note">Unsigned bytes; strings are UTF-8.</text>
<text x="590" y="630" class="heading">Number order</text>
<text x="590" y="662" class="note">Exact normalized decimal; no floating-point conversion.</text>
<text x="40" y="718" class="body">GSI ordered key = encoded index PK/SK || complete encoded base key.</text>
<text x="40" y="756" class="note">Wire primary keys remain DynamoDB AttributeValue objects; clients do not send internal routing bytes.</text>
</svg>

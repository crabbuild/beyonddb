<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 780" role="img" aria-labelledby="title desc">
<title id="title">Payloads have three different lifetimes</title>
<desc id="desc">Temporary wire-upload staging transfers bounded chunks without acquiring transaction locks or deciding a transaction. Sealing phase input atomically consumes it and writes durable BEGIN or prepare payloads. Participant prepare atomically writes phase records, images, locks and apply reservations. Resolution compacts write payloads and releases locks and claims; committed read images require durable consumption acknowledgement before cleanup. Decisions, identities and terminal tombstones remain retained. Chunking does not bound total disk, WAL, heap or history.</desc>
<defs>
 <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#1e293b" stroke-width="0.6"/></pattern>
 <style>
 text{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#f1f5f9}
 .title{font-size:32px;font-weight:700;letter-spacing:-0.6px}
 .heading{font-size:22px;font-weight:650}
 .body{font-size:20px}
 .note{font-size:18px;fill:#b8c7db}
 .eyebrow{font-size:17px;font-weight:650;letter-spacing:1.4px}
 .edge{fill:none;stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
 </style>
<marker id="arrow-cyan" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#22d3ee" stroke-width="1.6"/></marker>
<marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#34d399" stroke-width="1.6"/></marker>
<marker id="arrow-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#a78bfa" stroke-width="1.6"/></marker>
<marker id="arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#fbbf24" stroke-width="1.6"/></marker>
<marker id="arrow-rose" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#fb7185" stroke-width="1.6"/></marker>
<marker id="arrow-slate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#94a3b8" stroke-width="1.6"/></marker>
</defs>
<rect width="1120" height="780" fill="#0f172a"/>
<rect width="1120" height="780" fill="url(#grid)"/>
<text x="40" y="53" class="title">Payloads have three different lifetimes</text>
<text x="40" y="88" class="note">Wire staging, prepared work and terminal evidence have different cleanup rules.</text>
<rect x="40" y="142" width="320" height="340" rx="16" fill="#111c30" stroke="#22d3ee" stroke-width="1.3" stroke-dasharray="7 6"/>
<text x="58" y="182" class="eyebrow" style="fill:#22d3ee">1 · WIRE STAGING</text>
<rect x="400" y="142" width="320" height="340" rx="16" fill="#111c30" stroke="#a78bfa" stroke-width="1.3" stroke-dasharray="7 6"/>
<text x="418" y="182" class="eyebrow" style="fill:#a78bfa">2 · DURABLE PHASE</text>
<rect x="760" y="142" width="320" height="340" rx="16" fill="#111c30" stroke="#34d399" stroke-width="1.3" stroke-dasharray="7 6"/>
<text x="778" y="182" class="eyebrow" style="fill:#34d399">3 · TERMINAL EVIDENCE</text>
<path d="M360 280H400" class="edge" stroke="#22d3ee" marker-end="url(#arrow-cyan)"/>
<path d="M720 280H760" class="edge" stroke="#a78bfa" marker-end="url(#arrow-purple)"/>
<text x="60" y="228" class="note">Bounded upload chunks</text>
<text x="60" y="260" class="note">Immutable upload identity</text>
<text x="60" y="292" class="note">No transaction locks yet</text>
<text x="60" y="359" class="note">Sealed with phase admission;</text>
<text x="60" y="389" class="note">partial upload is not BEGIN.</text>
<text x="420" y="228" class="note">BEGIN / prepared payloads</text>
<text x="420" y="260" class="note">Locks + staged images</text>
<text x="420" y="292" class="note">Physical apply reservations</text>
<text x="420" y="359" class="note">Commit or roll back together</text>
<text x="420" y="389" class="note">inside the owning command.</text>
<text x="780" y="228" class="note">Decision + identities</text>
<text x="780" y="260" class="note">Resolution receipts</text>
<text x="780" y="292" class="note">Participant replay markers</text>
<text x="780" y="359" class="note">Keep delayed messages fenced;</text>
<text x="780" y="389" class="note">full retirement remains open.</text>
<text x="60" y="447" class="note" style="fill:#22d3ee">Transport success ≠ decision.</text>
<text x="420" y="447" class="note" style="fill:#a78bfa">Size includes apply work.</text>
<text x="780" y="447" class="note" style="fill:#34d399">Token expiry ≠ history GC.</text>
<rect x="40" y="535" width="500" height="112" rx="12" fill="#292047" stroke="#a78bfa" stroke-width="1.6"/>
<text x="62" y="570" class="heading">Write payloads</text>
<text x="62" y="601" class="body">Compact through terminal resolution.</text>
<text x="62" y="629" class="note">Keep identity, digest and terminal markers.</text>
<rect x="580" y="535" width="500" height="112" rx="12" fill="#292047" stroke="#a78bfa" stroke-width="1.6"/>
<text x="602" y="570" class="heading">Committed read images</text>
<text x="602" y="601" class="body">Retain until durable consumption intent.</text>
<text x="602" y="629" class="note">Recovery completes acknowledged cleanup.</text>
<text x="40" y="708" class="body">Chunk limits do not bound aggregate disk, WAL, heap, reservations or retained history.</text>
<text x="40" y="744" class="note">A timeout cannot reclaim an unresolved participant’s apply reservation.</text>
</svg>

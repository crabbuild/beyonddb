<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 790" role="img" aria-labelledby="title desc">
<title id="title">Recovery follows the durable decision</title>
<desc id="desc">Recovery observes the coordinator after establishing the required native ownership authority. BEGIN resumes immutable prepare work; startup does not alone authorize abort. A definitive failure or atomic ten-minute expiry decision may win ABORT only while BEGIN. COMMIT applies all original participants. ABORT discards staged state and records tombstones even for unprepared participants. Terminal decisions cannot change to their opposite. Unavailable owners and lost replies do not prove abort. No recovery path rewrites participants to current table routes.</desc>
<defs>
 <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#1e293b" stroke-width="0.6"/></pattern>
 <style>
 text{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#f1f5f9}
 .title{font-size:32px;font-weight:700;letter-spacing:-0.6px}
 .heading{font-size:22px;font-weight:650}
 .body{font-size:20px}
 .note{font-size:18px;fill:#b8c7db}
 .eyebrow{font-size:17px;font-weight:650;letter-spacing:1.4px}
 .edge{fill:none;stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
 </style>
<marker id="arrow-cyan" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#22d3ee" stroke-width="1.6"/></marker>
<marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#34d399" stroke-width="1.6"/></marker>
<marker id="arrow-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#a78bfa" stroke-width="1.6"/></marker>
<marker id="arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#fbbf24" stroke-width="1.6"/></marker>
<marker id="arrow-rose" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#fb7185" stroke-width="1.6"/></marker>
<marker id="arrow-slate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#94a3b8" stroke-width="1.6"/></marker>
</defs>
<rect width="1120" height="790" fill="#0f172a"/>
<rect width="1120" height="790" fill="url(#grid)"/>
<text x="40" y="53" class="title">Recovery follows the durable decision</text>
<text x="40" y="88" class="note">Read authoritative state; a timeout, lost reply or unavailable owner does not prove ABORT.</text>
<rect x="300" y="130" width="520" height="74" rx="12" fill="#292047" stroke="#a78bfa" stroke-width="1.6"/>
<text x="560" y="160" class="heading" text-anchor="middle">Observe the original coordinator</text>
<text x="560" y="188" class="note" text-anchor="middle">Use durable state and native ownership fences.</text>
<path d="M560 204V244" class="edge" stroke="#a78bfa"/>
<path d="M200 244H920" class="edge" stroke="#a78bfa"/>
<path d="M200 244V284" class="edge" stroke="#22d3ee" marker-end="url(#arrow-cyan)"/>
<rect x="40" y="284" width="320" height="305" rx="16" fill="#111c30" stroke="#22d3ee" stroke-width="1.3" stroke-dasharray="7 6"/>
<text x="60" y="326" class="heading" style="fill:#22d3ee">BEGIN</text>
<path d="M560 244V284" class="edge" stroke="#34d399" marker-end="url(#arrow-green)"/>
<rect x="400" y="284" width="320" height="305" rx="16" fill="#111c30" stroke="#34d399" stroke-width="1.3" stroke-dasharray="7 6"/>
<text x="420" y="326" class="heading" style="fill:#34d399">COMMIT</text>
<path d="M920 244V284" class="edge" stroke="#fb7185" marker-end="url(#arrow-rose)"/>
<rect x="760" y="284" width="320" height="305" rx="16" fill="#111c30" stroke="#fb7185" stroke-width="1.3" stroke-dasharray="7 6"/>
<text x="780" y="326" class="heading" style="fill:#fb7185">ABORT</text>
<text x="60" y="370" class="note">Resume original operations.</text>
<text x="60" y="401" class="note">Keep identities and epochs.</text>
<text x="60" y="452" class="note">ABORT needs a valid decision:</text>
<text x="60" y="483" class="note">definitive failure, or atomic</text>
<text x="60" y="514" class="note">ten-minute expiry check.</text>
<text x="420" y="370" class="note">Apply original participants.</text>
<text x="420" y="401" class="note">Release locks and claims.</text>
<text x="420" y="452" class="note">Retry resolution idempotently.</text>
<text x="420" y="483" class="note">Retain newer writes on replay.</text>
<text x="420" y="514" class="note">Record durable receipts.</text>
<text x="780" y="370" class="note">Discard staged work.</text>
<text x="780" y="401" class="note">Release locks and claims.</text>
<text x="780" y="452" class="note">Resolve unprepared Cells too.</text>
<text x="780" y="483" class="note">ABORTED tombstones reject</text>
<text x="780" y="514" class="note">a delayed prepare.</text>
<text x="60" y="564" class="note" style="fill:#22d3ee">Startup alone does not abort.</text>
<text x="420" y="564" class="note" style="fill:#34d399">Never change to ABORT.</text>
<text x="780" y="564" class="note" style="fill:#fb7185">Never change to COMMIT.</text>
<rect x="40" y="634" width="1040" height="106" rx="12" fill="#352b20" stroke="#fbbf24" stroke-width="1.6"/>
<text x="62" y="669" class="heading">Stable recovery authority</text>
<text x="62" y="699" class="body">Table splits and route changes do not rewrite an admitted participant set.</text>
<text x="62" y="727" class="note">An unavailable coordinator can keep affected keys locked until its durable decision is recovered.</text>
</svg>

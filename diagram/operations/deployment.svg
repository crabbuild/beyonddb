<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 610" role="img" aria-labelledby="title desc">
<title id="title">Deployment and trust boundaries</title>
<desc id="desc">Every server embeds ExtendDB, BeyondDB and Cellar. Peer authentication is separate from TLS.</desc>
<defs>
<pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#1e293b" stroke-width="0.5"/></pattern>
<marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0L10 4L0 8Z" fill="#94a3b8"/></marker>
<style>text{font-family:Arial,Helvetica,sans-serif;fill:#f1f5f9} .title{font-size:25px;font-weight:700} .heading{font-size:18px;font-weight:600} .note{font-size:15px;fill:#cbd5e1} .small{font-size:14px;fill:#94a3b8} .edge{fill:none;stroke:#94a3b8;stroke-width:1.8;marker-end:url(#arrow)}</style>
</defs>
<rect width="1000" height="610" rx="16" fill="#0f172a"/>
<rect width="1000" height="610" rx="16" fill="url(#grid)"/>
<path d="M290 177H380" class="edge"/>
<path d="M650 177H720" class="edge"/>
<path d="M515 220V355" class="edge"/>
<path d="M835 220V355" class="edge"/>
<path d="M420 220V265H170V355" class="edge"/>
<path d="M760 220V300H255V355" class="edge"/>
<rect x="50" y="135" width="240" height="85" rx="9" fill="#083344" stroke="#22d3ee" stroke-width="1.4"/>
<rect x="380" y="135" width="270" height="85" rx="9" fill="#064e3b" stroke="#34d399" stroke-width="1.4"/>
<rect x="720" y="135" width="230" height="85" rx="9" fill="#064e3b" stroke="#34d399" stroke-width="1.4"/>
<rect x="50" y="355" width="240" height="100" rx="9" fill="#422f18" stroke="#fbbf24" stroke-width="1.4"/>
<rect x="380" y="355" width="270" height="100" rx="9" fill="#3b2463" stroke="#a78bfa" stroke-width="1.4"/>
<rect x="720" y="355" width="230" height="100" rx="9" fill="#3b2463" stroke="#a78bfa" stroke-width="1.4"/>
<text x="35" y="45" class="title" text-anchor="start">Deployment and trust boundaries</text>
<text x="35" y="75" class="small" text-anchor="start">Every server embeds ExtendDB, BeyondDB and Cellar. Peer authentication is separate from TLS.</text>
<text x="170.0" y="165" class="heading" text-anchor="middle">AWS client</text>
<text x="170.0" y="189" class="note" text-anchor="middle">Signed DynamoDB requests</text>
<text x="515.0" y="165" class="heading" text-anchor="middle">BeyondDB node A</text>
<text x="515.0" y="189" class="note" text-anchor="middle">Public TLS + private peer port</text>
<text x="835.0" y="165" class="heading" text-anchor="middle">BeyondDB node B</text>
<text x="835.0" y="189" class="note" text-anchor="middle">Private peer port</text>
<text x="685" y="158" class="small" text-anchor="middle">peer</text>
<text x="170.0" y="385" class="heading" text-anchor="middle">S3-compatible bucket</text>
<text x="170.0" y="409" class="note" text-anchor="middle">Fleet data + native authority</text>
<text x="515.0" y="385" class="heading" text-anchor="middle">Node A local state</text>
<text x="515.0" y="409" class="note" text-anchor="middle">Persistent data and log files</text>
<text x="835.0" y="385" class="heading" text-anchor="middle">Node B local state</text>
<text x="835.0" y="409" class="note" text-anchor="middle">Persistent data and logs</text>
<text x="35" y="515" class="note" text-anchor="start">Public: HTTPS outside loopback. Private: isolated, encrypted deployment network.</text>
<text x="35" y="545" class="note" text-anchor="start">Preserve keys, node state and bucket prefix. Local-only mode has no fleet bucket.</text>
</svg>

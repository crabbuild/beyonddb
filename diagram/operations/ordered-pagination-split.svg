<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 866" role="img" aria-labelledby="title desc">
<title id="title">Resume from the logical key after a split</title>
<desc id="desc">Page one stops after sort key 12 for customer-42. Its LastEvaluatedKey contains logical PK/SK attributes, not a physical Cell identity. Between requests the range [10,20) splits at observed key 15 into two new children [10,15) and [15,20). The next request uses the same logical ExclusiveStartKey and current directory, visiting greater keys in the left and then right child. This illustrates forward resume; reverse resumes exclusively in the opposite direction. It is not a whole-table snapshot or a complete split-during-page qualification. Ambiguous mutations resolve through their original identity instead of being blindly resent to children.</desc>
<defs>
 <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#1e293b" stroke-width="0.6"/></pattern>
 <style>
 text{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#f1f5f9}
 .title{font-size:32px;font-weight:700;letter-spacing:-0.6px}
 .heading{font-size:22px;font-weight:650}
 .body{font-size:20px}
 .note{font-size:18px;fill:#b8c7db}
 .eyebrow{font-size:17px;font-weight:650;letter-spacing:1.4px}
 .edge{fill:none;stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
 </style>
<marker id="arrow-cyan" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#22d3ee" stroke-width="1.6"/></marker>
<marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#34d399" stroke-width="1.6"/></marker>
<marker id="arrow-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#a78bfa" stroke-width="1.6"/></marker>
<marker id="arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#fbbf24" stroke-width="1.6"/></marker>
<marker id="arrow-rose" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#fb7185" stroke-width="1.6"/></marker>
<marker id="arrow-slate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#94a3b8" stroke-width="1.6"/></marker>
</defs>
<rect width="1120" height="866" fill="#0f172a"/>
<rect width="1120" height="866" fill="url(#grid)"/>
<text x="40" y="53" class="title">Resume from the logical key after a split</text>
<text x="40" y="88" class="note">Continuation identifies the last evaluated user key; physical range identities can change.</text>
<rect x="40" y="132" width="1040" height="80" rx="12" fill="#102e40" stroke="#22d3ee" stroke-width="1.6"/>
<text x="560" y="166" class="heading" text-anchor="middle">Page 1 stops at (customer-42, 12)</text>
<text x="560" y="195" class="note" text-anchor="middle">LastEvaluatedKey = logical PK/SK attributes</text>
<path d="M560 212V252" class="edge" stroke="#a78bfa" marker-end="url(#arrow-purple)"/>
<rect x="300" y="252" width="520" height="74" rx="12" fill="#292047" stroke="#a78bfa" stroke-width="1.6"/>
<text x="560" y="282" class="heading" text-anchor="middle">Old Cell B: [10, 20)</text>
<text x="560" y="310" class="note" text-anchor="middle">Between requests, split at observed SK = 15.</text>
<path d="M560 326V372" class="edge" stroke="#a78bfa"/>
<path d="M285 372H835" class="edge" stroke="#a78bfa"/>
<path d="M285 372V412" class="edge" stroke="#34d399" marker-end="url(#arrow-green)"/>
<path d="M835 372V412" class="edge" stroke="#34d399" marker-end="url(#arrow-green)"/>
<rect x="40" y="412" width="490" height="88" rx="12" fill="#10392f" stroke="#34d399" stroke-width="1.6"/>
<text x="60" y="447" class="heading">New left child: [10, 15)</text>
<text x="60" y="477" class="note">Resume strictly after SK 12: e.g. 13, 14.</text>
<rect x="590" y="412" width="490" height="88" rx="12" fill="#10392f" stroke="#34d399" stroke-width="1.6"/>
<text x="610" y="447" class="heading">New right child: [15, 20)</text>
<text x="610" y="477" class="note">Continue with remaining keys: e.g. 15, 16, …</text>
<path d="M285 500V540H835V500" class="edge" stroke="#34d399"/>
<path d="M560 540V580" class="edge" stroke="#34d399" marker-end="url(#arrow-green)"/>
<rect x="190" y="580" width="740" height="90" rx="12" fill="#102e40" stroke="#22d3ee" stroke-width="1.6"/>
<text x="560" y="614" class="heading" text-anchor="middle">Page 2: same ExclusiveStartKey, current directory</text>
<text x="560" y="644" class="note" text-anchor="middle">No client-side Cell-ID translation; remaining logical keys are routed afresh.</text>
<text x="40" y="728" class="body">Read continuation does not make an uncertain mutation safe to submit to a new child.</text>
<text x="40" y="765" class="note">Resolve a submitted write through its original Cell/identity; retain coordinator participant authority.</text>
<text x="40" y="824" class="note">Illustrative resume between requests. Concurrent writes do not provide a whole-table snapshot.</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 696" role="img" aria-labelledby="title desc">
<title id="title">Choose the acknowledgement boundary</title>
<desc id="desc">Without fleet configuration, acknowledgement relies on local Cellar persistence and does not cover machine loss. Fleet mode defaults to bucket publication. With follower durability enabled, an eligible native follower fsync proof may race bucket publication. Every mode retains local data. Follower mode does not establish independent-host follower-loss tolerance. Preserve shutdown and handoff are separate choices.</desc>
<defs>
 <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#1e293b" stroke-width="0.6"/></pattern>
 <style>
 text{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#f1f5f9}
 .title{font-size:32px;font-weight:700;letter-spacing:-0.6px}
 .heading{font-size:22px;font-weight:650}
 .body{font-size:20px}
 .note{font-size:18px;fill:#b8c7db}
 .eyebrow{font-size:17px;font-weight:650;letter-spacing:1.4px}
 .edge{fill:none;stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
 </style>
<marker id="arrow-cyan" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#22d3ee" stroke-width="1.6"/></marker>
<marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#34d399" stroke-width="1.6"/></marker>
<marker id="arrow-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#a78bfa" stroke-width="1.6"/></marker>
<marker id="arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#fbbf24" stroke-width="1.6"/></marker>
<marker id="arrow-rose" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#fb7185" stroke-width="1.6"/></marker>
<marker id="arrow-slate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#94a3b8" stroke-width="1.6"/></marker>
</defs>
<rect width="1120" height="696" fill="#0f172a"/>
<rect width="1120" height="696" fill="url(#grid)"/>
<text x="40" y="53" class="title">Choose the acknowledgement boundary</text>
<text x="40" y="88" class="note">Storage mode selects the durability proof. Shutdown mode is a separate choice.</text>
<rect x="40" y="132" width="320" height="392" rx="16" fill="#111c30" stroke="#22d3ee" stroke-width="1.3" stroke-dasharray="7 6"/>
<text x="60" y="169" class="eyebrow" style="fill:#22d3ee">LOCAL</text>
<text x="60" y="208" class="note">No fleet object</text>
<rect x="60" y="250" width="280" height="80" rx="12" fill="#10392f" stroke="#34d399" stroke-width="1.6"/>
<text x="200" y="281" class="body" text-anchor="middle">Cell command commits</text>
<text x="200" y="309" class="note" text-anchor="middle">SQLite + LTX</text>
<path d="M200 330V370" class="edge" stroke="#22d3ee" marker-end="url(#arrow-cyan)"/>
<rect x="60" y="370" width="280" height="70" rx="12" fill="#102e40" stroke="#22d3ee" stroke-width="1.6"/>
<text x="200" y="400" class="body" text-anchor="middle">Local persistence</text>
<text x="200" y="428" class="note" text-anchor="middle">Proof → acknowledge</text>
<text x="60" y="475" class="note">Retain the node directory.</text>
<text x="60" y="503" class="note">Machine loss is not covered.</text>
<rect x="400" y="132" width="320" height="392" rx="16" fill="#111c30" stroke="#a78bfa" stroke-width="1.3" stroke-dasharray="7 6"/>
<text x="420" y="169" class="eyebrow" style="fill:#a78bfa">FLEET · DEFAULT</text>
<text x="420" y="208" class="note">follower_durability: false</text>
<rect x="420" y="250" width="280" height="80" rx="12" fill="#10392f" stroke="#34d399" stroke-width="1.6"/>
<text x="560" y="281" class="body" text-anchor="middle">Cell command commits</text>
<text x="560" y="309" class="note" text-anchor="middle">SQLite + LTX</text>
<path d="M560 330V370" class="edge" stroke="#a78bfa" marker-end="url(#arrow-purple)"/>
<rect x="420" y="370" width="280" height="70" rx="12" fill="#292047" stroke="#a78bfa" stroke-width="1.6"/>
<text x="560" y="400" class="body" text-anchor="middle">Bucket publication</text>
<text x="560" y="428" class="note" text-anchor="middle">Proof → acknowledge</text>
<text x="420" y="475" class="note">Use a dedicated S3 prefix.</text>
<text x="420" y="503" class="note">Conditional operations required.</text>
<rect x="760" y="132" width="320" height="392" rx="16" fill="#111c30" stroke="#fbbf24" stroke-width="1.3" stroke-dasharray="7 6"/>
<text x="780" y="169" class="eyebrow" style="fill:#fbbf24">FLEET · FOLLOWER</text>
<text x="780" y="208" class="note">follower_durability: true</text>
<rect x="780" y="250" width="280" height="80" rx="12" fill="#10392f" stroke="#34d399" stroke-width="1.6"/>
<text x="920" y="281" class="body" text-anchor="middle">Cell command commits</text>
<text x="920" y="309" class="note" text-anchor="middle">SQLite + LTX</text>
<path d="M920 330V370" class="edge" stroke="#fbbf24" marker-end="url(#arrow-amber)"/>
<rect x="780" y="370" width="280" height="70" rx="12" fill="#352b20" stroke="#fbbf24" stroke-width="1.6"/>
<text x="920" y="400" class="body" text-anchor="middle">Native follower fsync</text>
<text x="920" y="428" class="note" text-anchor="middle">Proof → acknowledge</text>
<text x="780" y="475" class="note">Eligible proof races the bucket.</text>
<text x="780" y="503" class="note">Qualification remains bounded.</text>
<text x="40" y="575" class="body">Every mode retains local node data. Follower proof is available only when eligible.</text>
<text x="40" y="611" class="note">This is a proof-selection diagram, not a machine-loss or fleet availability guarantee.</text>
<text x="40" y="656" class="note">Shutdown: preserve retains reload state; handoff needs a fleet and an eligible live peer.</text>
</svg>

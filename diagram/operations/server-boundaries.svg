<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 760" role="img" aria-labelledby="title desc">
<title id="title">Server boundaries: public, private, persistent</title>
<desc id="desc">AWS clients use the public HTTP or HTTPS endpoint through ExtendDB. BeyondDB owns routing and account maintenance. Cellar owns Cell execution, placement, ownership and authenticated private peer traffic. Each node retains local state; fleet mode additionally uses an S3-compatible conditional object store. Peer authentication does not encrypt transport; the credential encryption key protects credential secrets only.</desc>
<defs>
 <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#1e293b" stroke-width="0.6"/></pattern>
 <style>
 text{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#f1f5f9}
 .title{font-size:32px;font-weight:700;letter-spacing:-0.6px}
 .heading{font-size:22px;font-weight:650}
 .body{font-size:20px}
 .note{font-size:18px;fill:#b8c7db}
 .eyebrow{font-size:17px;font-weight:650;letter-spacing:1.4px}
 .edge{fill:none;stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
 </style>
<marker id="arrow-cyan" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#22d3ee" stroke-width="1.6"/></marker>
<marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#34d399" stroke-width="1.6"/></marker>
<marker id="arrow-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#a78bfa" stroke-width="1.6"/></marker>
<marker id="arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#fbbf24" stroke-width="1.6"/></marker>
<marker id="arrow-rose" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#fb7185" stroke-width="1.6"/></marker>
<marker id="arrow-slate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#94a3b8" stroke-width="1.6"/></marker>
</defs>
<rect width="1120" height="760" fill="#0f172a"/>
<rect width="1120" height="760" fill="url(#grid)"/>
<text x="40" y="53" class="title">Server boundaries: public, private, persistent</text>
<text x="40" y="88" class="note">Each node runs one beyonddb process; every table spans ordered range Cells.</text>
<rect x="340" y="125" width="740" height="380" rx="16" fill="#111c30" stroke="#34d399" stroke-width="1.3" stroke-dasharray="7 6"/>
<text x="364" y="158" class="eyebrow" style="fill:#34d399">ONE NODE · UNIQUE IDENTITY + LOCAL DIRECTORY</text>
<path d="M280 217H380" class="edge" stroke="#22d3ee" marker-end="url(#arrow-cyan)"/>
<path d="M710 254V294" class="edge" stroke="#34d399" marker-end="url(#arrow-green)"/>
<path d="M710 364V404" class="edge" stroke="#a78bfa" marker-end="url(#arrow-purple)"/>
<path d="M280 439H380" class="edge" stroke="#fbbf24" marker-end="url(#arrow-amber)"/>
<path d="M710 474V548H530V590" class="edge" stroke="#a78bfa" marker-end="url(#arrow-purple)"/>
<path d="M710 548H890V590" class="edge" stroke="#fbbf24" marker-end="url(#arrow-amber)"/>
<rect x="40" y="174" width="240" height="86" rx="12" fill="#102e40" stroke="#22d3ee" stroke-width="1.6"/>
<text x="60" y="208" class="heading">AWS SDK / CLI</text>
<text x="60" y="239" class="note">Signed DynamoDB calls</text>
<rect x="380" y="184" width="660" height="70" rx="12" fill="#102e40" stroke="#22d3ee" stroke-width="1.6"/>
<text x="400" y="214" class="heading">Public listener → ExtendDB</text>
<text x="400" y="241" class="note">HTTP on loopback; HTTPS for external serving</text>
<rect x="380" y="294" width="660" height="70" rx="12" fill="#10392f" stroke="#34d399" stroke-width="1.6"/>
<text x="400" y="324" class="heading">BeyondDB routing + maintenance</text>
<text x="400" y="351" class="note">Ordered ranges, transactions, indexes, TTL and retention</text>
<rect x="40" y="396" width="240" height="86" rx="12" fill="#352b20" stroke="#fbbf24" stroke-width="1.6"/>
<text x="60" y="430" class="heading">Fleet peers</text>
<text x="60" y="461" class="note">Private authenticated RPC</text>
<rect x="380" y="404" width="660" height="70" rx="12" fill="#292047" stroke="#a78bfa" stroke-width="1.6"/>
<text x="400" y="434" class="heading">Cellar execution + ownership</text>
<text x="400" y="461" class="note">Placement, fencing, SQLite, LTX and durability</text>
<rect x="380" y="590" width="300" height="84" rx="12" fill="#292047" stroke="#a78bfa" stroke-width="1.6"/>
<text x="400" y="624" class="heading">Local data directory</text>
<text x="400" y="653" class="note">Retain on every node</text>
<rect x="740" y="590" width="300" height="84" rx="12" fill="#352b20" stroke="#fbbf24" stroke-width="1.6"/>
<text x="760" y="624" class="heading">Conditional object store</text>
<text x="760" y="653" class="note">Fleet mode only</text>
<text x="40" y="550" class="heading">Separate controls</text>
<text x="40" y="581" class="note">Public TLS</text>
<text x="40" y="610" class="note">Shared peer key</text>
<text x="40" y="639" class="note">Credential-encryption key</text>
<text x="40" y="721" class="note">Peer authentication is not transport encryption; protect the private network externally.</text>
</svg>

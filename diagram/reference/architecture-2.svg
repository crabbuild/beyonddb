<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 1020" role="img" aria-labelledby="title desc">
<title id="title">Range split: prepare, verify, publish</title>
<desc id="desc">A serving source range creates a durable split plan. After prepared intents and projection journals drain, the source seals. Two child ranges are copied and verified before a replacement directory route is published. Both children open for serving before source residency retires when safe. Split plans remain durable and replayable; broad split qualification is separate.</desc>
<defs>
 <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#1e293b" stroke-width="0.6"/></pattern>
 <style>
 text{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#f1f5f9}
 .title{font-size:32px;font-weight:700;letter-spacing:-0.6px}
 .heading{font-size:22px;font-weight:650}
 .body{font-size:20px}
 .note{font-size:18px;fill:#b8c7db}
 .eyebrow{font-size:17px;font-weight:650;letter-spacing:1.4px}
 .edge{fill:none;stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
 </style>
<marker id="arrow-cyan" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#22d3ee" stroke-width="1.6"/></marker>
<marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#34d399" stroke-width="1.6"/></marker>
<marker id="arrow-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#a78bfa" stroke-width="1.6"/></marker>
<marker id="arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#fbbf24" stroke-width="1.6"/></marker>
<marker id="arrow-rose" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#fb7185" stroke-width="1.6"/></marker>
<marker id="arrow-slate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#94a3b8" stroke-width="1.6"/></marker>
</defs>
<rect width="1120" height="1020" fill="#0f172a"/>
<rect width="1120" height="1020" fill="url(#grid)"/>
<text x="40" y="53" class="title">Range split: prepare, verify, publish</text>
<text x="40" y="88" class="note">Publish the replacement route only after both child ranges are verified.</text>
<rect x="40" y="137" width="190" height="325" rx="12" fill="#102e40"/>
<text x="60" y="171" class="eyebrow" style="fill:#22d3ee">PREPARE</text>
<rect x="40" y="497" width="190" height="85" rx="12" fill="#292047"/>
<text x="60" y="531" class="eyebrow" style="fill:#a78bfa">VERIFY</text>
<rect x="40" y="617" width="190" height="325" rx="12" fill="#10392f"/>
<text x="60" y="651" class="eyebrow" style="fill:#34d399">CUT OVER</text>
<text x="60" y="208" class="note">Durable plan</text>
<text x="60" y="236" class="note">and source seal</text>
<text x="60" y="688" class="note">Publish, open,</text>
<text x="60" y="716" class="note">then retire</text>
<path d="M675 222V257" class="edge" stroke="#22d3ee" marker-end="url(#arrow-cyan)"/>
<path d="M675 342V377" class="edge" stroke="#22d3ee" marker-end="url(#arrow-cyan)"/>
<path d="M675 462V497" class="edge" stroke="#22d3ee" marker-end="url(#arrow-cyan)"/>
<path d="M675 582V617" class="edge" stroke="#a78bfa" marker-end="url(#arrow-purple)"/>
<path d="M675 702V737" class="edge" stroke="#34d399" marker-end="url(#arrow-green)"/>
<path d="M675 822V857" class="edge" stroke="#34d399" marker-end="url(#arrow-green)"/>
<rect x="270" y="137" width="810" height="85" rx="20" fill="#102e40" stroke="#22d3ee" stroke-width="1.6"/>
<circle cx="309" cy="179" r="21" fill="#22d3ee"/>
<text x="309" y="186" class="heading" style="fill:#0f172a" text-anchor="middle">1</text>
<text x="347" y="170" class="heading">Serving source range</text>
<text x="347" y="199" class="note">The existing range owns and serves its ordered interval.</text>
<rect x="270" y="257" width="810" height="85" rx="12" fill="#102e40" stroke="#22d3ee" stroke-width="1.6"/>
<circle cx="309" cy="299" r="21" fill="#22d3ee"/>
<text x="309" y="306" class="heading" style="fill:#0f172a" text-anchor="middle">2</text>
<text x="347" y="290" class="heading">Record durable split plan</text>
<text x="347" y="319" class="note">Keep split progress replayable across owner recovery.</text>
<rect x="270" y="377" width="810" height="85" rx="12" fill="#102e40" stroke="#22d3ee" stroke-width="1.6"/>
<circle cx="309" cy="419" r="21" fill="#22d3ee"/>
<text x="309" y="426" class="heading" style="fill:#0f172a" text-anchor="middle">3</text>
<text x="347" y="410" class="heading">Seal source range</text>
<text x="347" y="439" class="note">Prepared intents and pending projection journals must drain.</text>
<rect x="270" y="497" width="810" height="85" rx="12" fill="#292047" stroke="#a78bfa" stroke-width="1.6"/>
<circle cx="309" cy="539" r="21" fill="#a78bfa"/>
<text x="309" y="546" class="heading" style="fill:#0f172a" text-anchor="middle">4</text>
<text x="347" y="530" class="heading">Copy and verify both children</text>
<text x="347" y="559" class="note">Verify two child ranges before changing the directory route.</text>
<rect x="270" y="617" width="810" height="85" rx="12" fill="#10392f" stroke="#34d399" stroke-width="1.6"/>
<circle cx="309" cy="659" r="21" fill="#34d399"/>
<text x="309" y="666" class="heading" style="fill:#0f172a" text-anchor="middle">5</text>
<text x="347" y="650" class="heading">Publish replacement directory route</text>
<text x="347" y="679" class="note">Retain the split plan until both child ranges are open.</text>
<rect x="270" y="737" width="810" height="85" rx="12" fill="#10392f" stroke="#34d399" stroke-width="1.6"/>
<circle cx="309" cy="779" r="21" fill="#34d399"/>
<text x="309" y="786" class="heading" style="fill:#0f172a" text-anchor="middle">6</text>
<text x="347" y="770" class="heading">Open children for serving</text>
<text x="347" y="799" class="note">Serve through the replacement route; fence stale source work.</text>
<rect x="270" y="857" width="810" height="85" rx="20" fill="#10392f" stroke="#34d399" stroke-width="1.6"/>
<circle cx="309" cy="899" r="21" fill="#34d399"/>
<text x="309" y="906" class="heading" style="fill:#0f172a" text-anchor="middle">7</text>
<text x="347" y="890" class="heading">Retire source residency when safe</text>
<text x="347" y="919" class="note">Reclaim only when the split protocol permits it.</text>
<text x="40" y="990" class="note">Safety order shown here; broad split behavior and Scan continuation remain under qualification.</text>
</svg>

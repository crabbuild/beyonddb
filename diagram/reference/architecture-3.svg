<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 820" role="img" aria-labelledby="title desc">
<title id="title">GSI projection: commit, deliver, confirm</title>
<desc id="desc">The base data Cell atomically commits the item and immutable projection journal. The write is acknowledged after durable base commit. A projection worker reads the journal and sends idempotent versioned entries or tombstones to each required GSI Cell. Durable receipts return to the worker. The journal entry is pruned only after all required index receipts. GSI reads are eventually consistent; base transactions do not create an atomic GSI view.</desc>
<defs>
 <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#1e293b" stroke-width="0.6"/></pattern>
 <style>
 text{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#f1f5f9}
 .title{font-size:32px;font-weight:700;letter-spacing:-0.6px}
 .heading{font-size:22px;font-weight:650}
 .body{font-size:20px}
 .note{font-size:18px;fill:#b8c7db}
 .eyebrow{font-size:17px;font-weight:650;letter-spacing:1.4px}
 .edge{fill:none;stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
 </style>
<marker id="arrow-cyan" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#22d3ee" stroke-width="1.6"/></marker>
<marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#34d399" stroke-width="1.6"/></marker>
<marker id="arrow-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#a78bfa" stroke-width="1.6"/></marker>
<marker id="arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#fbbf24" stroke-width="1.6"/></marker>
<marker id="arrow-rose" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#fb7185" stroke-width="1.6"/></marker>
<marker id="arrow-slate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#94a3b8" stroke-width="1.6"/></marker>
</defs>
<rect width="1120" height="820" fill="#0f172a"/>
<rect width="1120" height="820" fill="url(#grid)"/>
<text x="40" y="53" class="title">GSI projection: commit, deliver, confirm</text>
<text x="40" y="88" class="note">Base acknowledgement and index delivery have separate completion points.</text>
<rect x="40" y="122" width="1040" height="196" rx="16" fill="#111c30" stroke="#22d3ee" stroke-width="1.3" stroke-dasharray="7 6"/>
<text x="64" y="155" class="eyebrow" style="fill:#22d3ee">BASE WRITE · SYNCHRONOUS</text>
<path d="M470 230H725" class="edge" stroke="#22d3ee" marker-end="url(#arrow-cyan)"/>
<text x="597" y="209" class="note" style="fill:#22d3ee" text-anchor="middle">Durable base commit</text>
<rect x="64" y="183" width="406" height="104" rx="12" fill="#292047" stroke="#a78bfa" stroke-width="1.6"/>
<text x="88" y="217" class="heading">Base data Cell</text>
<text x="88" y="247" class="body">Item + immutable projection journal</text>
<text x="88" y="274" class="note">Committed atomically</text>
<rect x="725" y="194" width="331" height="80" rx="12" fill="#102e40" stroke="#22d3ee" stroke-width="1.6"/>
<text x="890" y="227" class="heading" text-anchor="middle">Acknowledge write</text>
<text x="890" y="255" class="note" text-anchor="middle">After the base durability gate</text>
<rect x="40" y="365" width="1040" height="349" rx="16" fill="#111c30" stroke="#34d399" stroke-width="1.3" stroke-dasharray="7 6"/>
<text x="1056" y="399" class="eyebrow" style="fill:#34d399" text-anchor="end">INDEX PROJECTION · ASYNCHRONOUS</text>
<path d="M200 287V444" class="edge" stroke="#a78bfa" marker-end="url(#arrow-purple)"/>
<rect x="215" y="330" width="196" height="30" rx="5" fill="#0f172a"/>
<text x="227" y="351" class="note">Read committed journal</text>
<path d="M364 474H750" class="edge" stroke="#34d399" marker-end="url(#arrow-green)"/>
<text x="557" y="454" class="note" style="fill:#34d399" text-anchor="middle">Idempotent, versioned update</text>
<path d="M750 534H364" class="edge" stroke="#a78bfa" stroke-dasharray="7 6" marker-end="url(#arrow-purple)"/>
<text x="557" y="565" class="note" style="fill:#a78bfa" text-anchor="middle">Durable receipt from each index</text>
<rect x="64" y="444" width="300" height="108" rx="12" fill="#10392f" stroke="#34d399" stroke-width="1.6"/>
<text x="214" y="481" class="heading" text-anchor="middle">Projection worker</text>
<text x="214" y="514" class="note" text-anchor="middle">Replay pending journal work</text>
<rect x="750" y="444" width="306" height="108" rx="12" fill="#292047" stroke="#a78bfa" stroke-width="1.6"/>
<text x="903" y="481" class="heading" text-anchor="middle">Required GSI Cells</text>
<text x="903" y="514" class="note" text-anchor="middle">Versioned entry or tombstone</text>
<path d="M214 552V650H430" class="edge" stroke="#34d399" marker-end="url(#arrow-green)"/>
<text x="233" y="623" class="note" style="fill:#34d399">All required receipts</text>
<rect x="430" y="612" width="466" height="76" rx="12" fill="#10392f" stroke="#34d399" stroke-width="1.6"/>
<text x="663" y="642" class="heading" text-anchor="middle">Prune journal entry</text>
<text x="663" y="670" class="note" text-anchor="middle">Only after every required index confirms durability</text>
<text x="40" y="756" class="body">An unavailable index delays its own projection; healthy indexes can advance.</text>
<text x="40" y="791" class="note">GSI reads are eventually consistent. A base transaction does not create an atomic GSI view.</text>
</svg>

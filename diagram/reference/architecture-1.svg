<rect x="290" y="310" width="540" height="82" rx="12" fill="#10392f" stroke="#34d399" stroke-width="1.6"/>
<text x="560" y="344" class="heading" text-anchor="middle">BeyondDB StorageEngine / CatalogStore</text>
<text x="560" y="373" class="note" text-anchor="middle">Application adapters, metadata and ordered routing</text>

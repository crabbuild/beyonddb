<text x="560" y="956" class="heading" text-anchor="middle">Cellar SQLite + LTX</text>
<text x="560" y="982" class="note" text-anchor="middle">Shared execution and durability layer for every Cell type</text>
<path d="M560 994V1034" class="edge" stroke="#fbbf24" marker-end="url(#arrow-amber)"/>
<rect x="230" y="1034" width="660" height="40" rx="8" fill="#352b20" stroke="#fbbf24" stroke-width="1.6"/>
<text x="560" y="1061" class="body" text-anchor="middle">Fleet mode: conditional object store</text>
</svg>

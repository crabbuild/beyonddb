<rect x="64" y="615" width="992" height="275" rx="16" fill="#111c30" stroke="#a78bfa" stroke-width="1.3" stroke-dasharray="7 6"/>
<text x="88" y="646" class="eyebrow" style="fill:#a78bfa">INDEPENDENT CELL TYPES</text>
<rect x="88" y="670" width="280" height="76" rx="12" fill="#292047" stroke="#a78bfa" stroke-width="1.6"/>
<text x="104" y="699" class="heading">Account Cell</text>

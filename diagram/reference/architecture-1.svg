<rect x="40" y="160" width="305" height="84" rx="12" fill="#102e40" stroke="#22d3ee" stroke-width="1.6"/>
<text x="60" y="194" class="heading">AWS SDK or CLI</text>
<text x="60" y="223" class="note">DynamoDB API requests</text>
<rect x="395" y="160" width="310" height="84" rx="12" fill="#102e40" stroke="#22d3ee" stroke-width="1.6"/>
<text x="415" y="194" class="heading">ExtendDB HTTP + SigV4</text>
<text x="415" y="223" class="note">Protocol and authentication</text>
<rect x="755" y="160" width="325" height="84" rx="12" fill="#102e40" stroke="#22d3ee" stroke-width="1.6"/>
<text x="775" y="194" class="heading">ExtendDB engine</text>
<text x="775" y="223" class="note">Validation and operations</text>

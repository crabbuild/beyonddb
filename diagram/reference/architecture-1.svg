<text x="64" y="473" class="eyebrow" style="fill:#fbbf24">LEASED BEYONDDB NODES</text>
<text x="1055" y="473" class="note" text-anchor="end">Ownership is per Cell</text>
<path d="M560 392V505" class="edge" stroke="#34d399" marker-end="url(#arrow-green)"/>

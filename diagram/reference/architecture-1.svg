<text x="436" y="727" class="note">Base-table and GSI routes</text>
<rect x="752" y="670" width="280" height="76" rx="12" fill="#3b2036" stroke="#fb7185" stroke-width="1.6"/>
<text x="768" y="699" class="heading">Credential Cells</text>
<text x="768" y="727" class="note">Encrypted keys and tokens</text>
<rect x="88" y="786" width="280" height="76" rx="12" fill="#292047" stroke="#a78bfa" stroke-width="1.6"/>
<text x="104" y="815" class="heading">Coordinator Cells</text>
<text x="104" y="843" class="note">Durable transaction decisions</text>
<rect x="420" y="786" width="280" height="76" rx="12" fill="#292047" stroke="#a78bfa" stroke-width="1.6"/>

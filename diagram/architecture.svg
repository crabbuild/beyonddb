<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" role="img" aria-labelledby="title description">
  <title id="title">BeyondDB: one executable, many ordered cells</title>
  <desc id="description">AWS SDK and CLI requests enter a BeyondDB executable. ExtendDB handles the DynamoDB protocol and authentication. BeyondDB routes ordered keys and coordinates transactions. The embedded Cellar SDK executes cells and manages ownership and durability. One table has four ordered data ranges. Cellar can host their cells across two fleet nodes. Account, credential, directory and coordinator cells also use Cellar.</desc>
  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#1e293b" stroke-width=".5"/></pattern>
    <marker id="arrow" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="8" markerHeight="7" orient="auto"><path d="M0 0 10 4 0 8Z" fill="#94a3b8"/></marker>
    <style>
      text {font-family:Arial,Helvetica,sans-serif;fill:#f1f5f9}
      .title {font-size:25px;font-weight:700}
      .heading {font-size:18px;font-weight:650}
      .body {font-size:15px}
      .note {font-size:13px;fill:#cbd5e1}
      .caption {font-size:14px;fill:#94a3b8}
      .line {fill:none;stroke:#94a3b8;stroke-width:1.6;marker-end:url(#arrow)}
      .shell {fill:#0f172a;stroke:#475569;stroke-width:1.2}
    </style>
  </defs>
  <rect width="960" height="620" rx="16" fill="#0f172a"/>
  <rect width="960" height="620" rx="16" fill="url(#grid)"/>
  <text x="32" y="44" class="title">One executable. Many ordered cells.</text>
  <text x="32" y="72" class="caption">DynamoDB requests in · Cellar execution and durability underneath</text>

  <rect x="32" y="168" width="402" height="338" rx="12" fill="none" stroke="#fbbf24" stroke-width="1.2" stroke-dasharray="7 5"/>
  <rect x="474" y="110" width="454" height="396" rx="12" fill="none" stroke="#475569" stroke-width="1.2" stroke-dasharray="7 5"/>

  <path class="line" d="M233 152V204"/>
  <path class="line" d="M233 274V314"/>
  <path class="line" d="M233 384V424"/>
  <path class="line" d="M402 458H454V160H506"/>
  <path class="line" d="M701 184V224"/>
  <path d="M701 294V324M604 324H800M604 324V352M800 324V352" fill="none" stroke="#94a3b8" stroke-width="1.6"/>
  <path class="line" d="M604 344V360"/>
  <path class="line" d="M800 344V360"/>

  <rect x="83" y="102" width="300" height="50" rx="8" class="shell"/>
  <text x="233" y="133" class="heading" text-anchor="middle">AWS SDK / CLI</text>
  <text x="48" y="192" class="note" style="fill:#fbbf24">Inside every BeyondDB executable</text>

  <rect x="64" y="204" width="338" height="70" rx="8" fill="#083344" stroke="#22d3ee"/>
  <text x="233" y="232" class="heading" text-anchor="middle">ExtendDB</text>
  <text x="233" y="255" class="body" text-anchor="middle">HTTP · SigV4 · IAM · expressions</text>
  <rect x="64" y="314" width="338" height="70" rx="8" fill="#064e3b" stroke="#34d399"/>
  <text x="233" y="342" class="heading" text-anchor="middle">BeyondDB</text>
  <text x="233" y="365" class="body" text-anchor="middle">Range routing · indexes · transactions</text>
  <rect x="64" y="424" width="338" height="70" rx="8" fill="#4c1d95" stroke="#a78bfa"/>
  <text x="233" y="452" class="heading" text-anchor="middle">Cellar SDK</text>
  <text x="233" y="475" class="body" text-anchor="middle">Execution · placement · fencing</text>

  <text x="701" y="142" class="heading" text-anchor="middle">One logical table</text>
  <rect x="506" y="153" width="390" height="31" rx="5" fill="#064e3b" stroke="#34d399"/>
  <text x="701" y="174" class="body" text-anchor="middle">Ordered by (partition key, sort key)</text>
  <rect x="506" y="224" width="90" height="70" rx="6" fill="#4c1d95" stroke="#a78bfa"/>
  <rect x="606" y="224" width="90" height="70" rx="6" fill="#4c1d95" stroke="#a78bfa"/>
  <rect x="706" y="224" width="90" height="70" rx="6" fill="#4c1d95" stroke="#a78bfa"/>
  <rect x="806" y="224" width="90" height="70" rx="6" fill="#4c1d95" stroke="#a78bfa"/>
  <text x="551" y="252" class="body" text-anchor="middle">Cell A</text><text x="551" y="275" class="note" text-anchor="middle">range 1</text>
  <text x="651" y="252" class="body" text-anchor="middle">Cell B</text><text x="651" y="275" class="note" text-anchor="middle">range 2</text>
  <text x="751" y="252" class="body" text-anchor="middle">Cell C</text><text x="751" y="275" class="note" text-anchor="middle">range 3</text>
  <text x="851" y="252" class="body" text-anchor="middle">Cell D</text><text x="851" y="275" class="note" text-anchor="middle">range 4</text>
  <text x="701" y="345" class="caption" text-anchor="middle">Illustrative fleet placement</text>

  <rect x="506" y="360" width="184" height="84" rx="8" class="shell"/>
  <rect x="712" y="360" width="184" height="84" rx="8" class="shell"/>
  <text x="598" y="390" class="heading" text-anchor="middle">Node 1</text>
  <text x="598" y="416" class="body" text-anchor="middle">Cells A + C</text>
  <text x="804" y="390" class="heading" text-anchor="middle">Node 2</text>
  <text x="804" y="416" class="body" text-anchor="middle">Cells B + D</text>
  <text x="701" y="477" class="caption" text-anchor="middle">Local SQLite + object-store recovery in fleet mode</text>

  <text x="32" y="549" class="body">Metadata has cells too:</text>
  <text x="32" y="575" class="caption">account · credentials · directories · transaction coordinators</text>
  <text x="928" y="575" class="note" text-anchor="end">4 initial ranges by default · configurable 2–256</text>
</svg>

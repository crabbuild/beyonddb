name: Signed SDK qualification

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: beyonddb-sdk-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  sdk:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      RUST_BACKTRACE: "1"
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master
        with:
          toolchain: 1.97.0
      - name: Prepare fixtures
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/beyonddb-fixtures" "$RUNNER_TEMP/beyonddb-logs"
          echo "TMPDIR=$RUNNER_TEMP/beyonddb-fixtures" >> "$GITHUB_ENV"
      - name: Install process-test tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -y
          sudo apt-get install -y pipx openssl
          pipx install awscli
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          docker info
      - name: Signed SDK and owner recovery
        shell: bash
        run: |
          set -euo pipefail
          result=0
          RUST_MIN_STACK=16777216 cargo test --locked --test elastic_cells \
            -- --include-ignored --test-threads=1 --nocapture \
            2>&1 | tee "$RUNNER_TEMP/beyonddb-logs/native.log" || result=$?
          cargo test --locked --no-fail-fast --test peer_network --test server_binary \
            -- --include-ignored --test-threads=1 --nocapture \
            2>&1 | tee "$RUNNER_TEMP/beyonddb-logs/sdk.log" || result=$?
          exit "$result"
      - name: Retain qualification logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: beyonddb-sdk-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/beyonddb-logs/
          if-no-files-found: warn
          retention-days: 7

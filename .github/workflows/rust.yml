name: Rust

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  benchmark-tools:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - name: Check configurable benchmark tooling
        run: |
          python3 -m venv "$RUNNER_TEMP/perf-venv"
          "$RUNNER_TEMP/perf-venv/bin/pip" install -r scripts/perf/requirements.txt
          "$RUNNER_TEMP/perf-venv/bin/python" -m unittest discover -s scripts/perf -p 'test_*.py'
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master
        with:
          toolchain: 1.97.0
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Format
        run: cargo fmt --all --check
      - name: Check all targets
        run: cargo check --all-targets --locked
      - name: Strict Clippy
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: Build server
        run: cargo build --bin beyonddb --locked
      - name: Transaction recovery
        # Each fixture retains its internal concurrency; isolate large stores.
        run: cargo test --locked --test cellar_transactions -- --test-threads=1
      - name: Cellar libraries and domain fixtures
        run: >-
          cargo test --workspace --lib --test account_cell --test cellar_sdk
          --test cellar_domain --test cellar_directories --test cellar_peer
          --test node_log_authority --test cellar_indexes
          --test embedded --test ranges --locked

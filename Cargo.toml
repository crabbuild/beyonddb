[workspace]
resolver = "3"
members = ["crates/bdb-cellar-runtime", "crates/bdb-keyspace"]

[workspace.package]
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/crabbuild/beyonddb"
rust-version = "1.97"

[workspace.dependencies]
cellar = { package = "cellar-main", version = "=0.1.0" }
async-trait = "0.1"
blake3 = "1.8"
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = "1.49"
tokio-util = "0.7"
tracing = "0.1"
uuid = { version = "=1.24.0", features = ["v7", "serde"] }
time = { version = "=0.3.47", features = ["formatting", "parsing", "serde", "serde-well-known"] }
aws-config = "1"
aws-credential-types = "1"
aws-sdk-dynamodb = "1"
ed25519-dalek = "2.2"
object_store = { version = "0.12.5", default-features = false, features = ["aws"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
tempfile = "3"

[package]
name = "beyonddb"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false
description = "Cell-based DynamoDB service over the embedded Cellar SDK"

[dependencies]
anyhow = "1"
bdb-cellar-runtime = { path = "crates/bdb-cellar-runtime" }
bdb-keyspace = { path = "crates/bdb-keyspace" }
cellar.workspace = true
http = "1"
bytes = "1"
http-body = "1"
http-body-util = "0.1"
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"] }
aes-gcm = "0.10"
async-trait.workspace = true
bigdecimal = "0.4"
blake3.workspace = true
extenddb-auth = { git = "https://github.com/crabbuild/extenddb.git", rev = "7eaa89b437feed0af0f05883d3f1493f86c6fc6d" }
extenddb-core = { git = "https://github.com/crabbuild/extenddb.git", rev = "7eaa89b437feed0af0f05883d3f1493f86c6fc6d" }
extenddb-server = { git = "https://github.com/crabbuild/extenddb.git", rev = "7eaa89b437feed0af0f05883d3f1493f86c6fc6d" }
extenddb-storage = { git = "https://github.com/crabbuild/extenddb.git", rev = "7eaa89b437feed0af0f05883d3f1493f86c6fc6d" }
futures-util.workspace = true
fs4 = "0.13.1"
getrandom = "0.3"
object_store.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
sysinfo = { version = "0.38.4", default-features = false, features = ["system"] }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "net", "signal", "time", "fs"] }
tokio-util.workspace = true
tracing.workspace = true
tracing-subscriber = "0.3"
time.workspace = true
uuid.workspace = true
zeroize = "1"

[dev-dependencies]
rusqlite = { version = "=0.31.0", features = ["blob"] }
prost = "=0.13.5"
aws-config.workspace = true
aws-credential-types.workspace = true
aws-sdk-dynamodb.workspace = true
ed25519-dalek.workspace = true
extenddb-engine = { git = "https://github.com/crabbuild/extenddb.git", rev = "7eaa89b437feed0af0f05883d3f1493f86c6fc6d" }
tempfile.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "net", "time"] }

# Physical prepare reservations feed the LTX codec even in local SDK tests.
# Keep its checksums/compression optimized under the development/test profiles.
[profile.dev.package.cellar-ltx]
opt-level = 2
[profile.dev.package.crc-fast]
opt-level = 2
[profile.dev.package.lz4_flex]
opt-level = 2

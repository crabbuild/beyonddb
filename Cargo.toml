[workspace]
resolver = "3"

[workspace.package]
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/crabbuild/beyonddb"
rust-version = "1.97"

[workspace.dependencies]
cellule-app = { git = "https://github.com/crabbuild/cellule.git", rev = "75462e46c203256fb3fe70903908103f619d99b2" }
cellule-host = { git = "https://github.com/crabbuild/cellule.git", rev = "75462e46c203256fb3fe70903908103f619d99b2" }
cellule-peer-http = { git = "https://github.com/crabbuild/cellule.git", rev = "75462e46c203256fb3fe70903908103f619d99b2" }
cellule-runtime = { git = "https://github.com/crabbuild/cellule.git", rev = "75462e46c203256fb3fe70903908103f619d99b2" }
cellule-store = { git = "https://github.com/crabbuild/cellule.git", rev = "75462e46c203256fb3fe70903908103f619d99b2" }
cellule-ltx = { git = "https://github.com/crabbuild/cellule.git", rev = "75462e46c203256fb3fe70903908103f619d99b2" }
async-trait = "0.1"
blake3 = "1.8"
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = "1.49"
tokio-util = "0.7"
tracing = "0.1"
uuid = { version = "=1.24.0", features = ["v7", "serde"] }
time = { version = "=0.3.47", features = ["formatting", "parsing", "serde", "serde-well-known"] }
aws-config = "1"
aws-credential-types = "1"
aws-sdk-dynamodb = "1"
ed25519-dalek = "2.2"
object_store = { version = "0.14.1", default-features = false }
tempfile = "3"

[package]
name = "beyonddb"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false
description = "Cell-based DynamoDB service over Cellule"

[dependencies]
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"] }
aes-gcm = "0.10"
async-trait.workspace = true
bigdecimal = "0.4"
blake3.workspace = true
cellule-app.workspace = true
cellule-host.workspace = true
cellule-peer-http.workspace = true
cellule-runtime.workspace = true
cellule-store.workspace = true
cellule-ltx = { workspace = true, features = ["replica"] }
extenddb-auth = { git = "https://github.com/ExtendDB/extenddb.git", rev = "bdb7b3df4ace3b80a6e928f144036d056aec0327" }
extenddb-core = { git = "https://github.com/ExtendDB/extenddb.git", rev = "bdb7b3df4ace3b80a6e928f144036d056aec0327" }
extenddb-server = { git = "https://github.com/ExtendDB/extenddb.git", rev = "bdb7b3df4ace3b80a6e928f144036d056aec0327" }
extenddb-storage = { git = "https://github.com/ExtendDB/extenddb.git", rev = "bdb7b3df4ace3b80a6e928f144036d056aec0327" }
futures-util.workspace = true
fs4 = "0.13.1"
getrandom = "0.3"
serde.workspace = true
serde_json.workspace = true
sysinfo = { version = "0.38.4", default-features = false, features = ["system"] }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "net", "signal", "time", "fs"] }
tokio-util.workspace = true
tracing.workspace = true
tracing-subscriber = "0.3"
time.workspace = true
uuid.workspace = true
zeroize = "1"

[dev-dependencies]
cellule-store = { workspace = true, features = ["test-support"] }
aws-config.workspace = true
aws-credential-types.workspace = true
aws-sdk-dynamodb.workspace = true
ed25519-dalek.workspace = true
extenddb-engine = { git = "https://github.com/ExtendDB/extenddb.git", rev = "bdb7b3df4ace3b80a6e928f144036d056aec0327" }
object_store.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "net", "time"] }
